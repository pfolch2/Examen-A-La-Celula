<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Test interactiu</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  padding: 20px;
}

.quiz-container {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.option {
  display: block;
  margin: 5px 0;
  padding: 10px;
  background: #e0e0e0;
  border-radius: 5px;
  cursor: pointer;
}

.correct { background: #4CAF50; color: white; }
.wrong { background: #f44336; color: white; }

.word {
  padding: 2px;
}

.highlight {
  background-color: lightblue;
  text-decoration: underline;
}

button {
  margin: 5px 5px 10px 0;
  padding: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="quiz-container">

<!-- PREGUNTA 1 -->
<div class="question-block">
  <p id="q1"></p>

  <button onclick="speakFull('q1')">🔊 Llegir tot</button>
  <button onclick="speakWordByWord('q1')">🔤 Paraula a paraula</button>

  <div>
    <span class="option" onclick="selectOption(this,false,'r1')">a) DORMIR</span>
    <span class="option" onclick="selectOption(this,true,'r1')">b) NUTRICIÓ</span>
    <span class="option" onclick="selectOption(this,false,'r1')">c) CÓRRER</span>
  </div>
  <p id="r1"></p>
</div>

<!-- PREGUNTA 2 -->
<div class="question-block">
  <p id="q2"></p>

  <button onclick="speakFull('q2')">🔊 Llegir tot</button>
  <button onclick="speakWordByWord('q2')">🔤 Paraula a paraula</button>

  <div>
    <span class="option" onclick="selectOption(this,false,'r2')">a) DORM TOT EL DIA</span>
    <span class="option" onclick="selectOption(this,true,'r2')">b) NOTA EL QUE PASSA I RESPON</span>
    <span class="option" onclick="selectOption(this,false,'r2')">c) NO FA RES</span>
  </div>
  <p id="r2"></p>
</div>

</div>

<script>
// TEXTOS
const questions = {
  q1: "1) QUINA ÉS UNA FUNCIÓ VITAL?",
  q2: "2) QUÈ FA UN ÉSSER VIU QUAN ES RELACIONA?"
};

// CONVERTIR A PARAULES SEPARADES
function renderText(id) {
  const container = document.getElementById(id);
  const words = questions[id].split(" ");

  container.innerHTML = words
    .map(word => `<span class="word">${word}</span>`)
    .join(" ");
}

// LLEGIR TOT
function speakFull(id) {
  const text = questions[id];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ca-ES";
  speechSynthesis.speak(utterance);
}

// LLEGIR PARAULA A PARAULA + SUBRATLLAT
function speakWordByWord(id) {
  const container = document.getElementById(id);
  const words = container.querySelectorAll(".word");

  let i = 0;

  function speakNext() {
    if (i > 0) words[i - 1].classList.remove("highlight");

    if (i < words.length) {
      const word = words[i];
      word.classList.add("highlight");

      const utterance = new SpeechSynthesisUtterance(word.innerText);
      utterance.lang = "ca-ES";

      utterance.onend = () => {
        i++;
        speakNext();
      };

      speechSynthesis.speak(utterance);
    }
  }

  speakNext();
}

// OPCIONS
function selectOption(el, correct, resultId) {
  const siblings = el.parentElement.querySelectorAll(".option");
  siblings.forEach(btn => btn.classList.remove("correct", "wrong"));

  if (correct) {
    el.classList.add("correct");
    document.getElementById(resultId).innerText = "✔ Correcte!";
  } else {
    el.classList.add("wrong");
    document.getElementById(resultId).innerText = "✘ Incorrecte";
  }
}

// INIT
renderText("q1");
renderText("q2");
</script>

</body>
</html>
